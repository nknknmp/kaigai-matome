# 海外まとめフィード: 毎朝 7:00（日本時間）に記事を作って公開する。
# 元ファイルは dev-toolbox の redditTwitter/daily.yml。build.py が公開リポジトリへコピーする。
name: daily

# 2026-11-28 に毎朝の自動作成（cron）をやめた。大きな板から点数順で選ぶと興味の無い記事ばかりだったため。
# 今は「url」を渡されたスレ1本だけを訳す（スマホの共有ボタンから呼ぶ）。戻すときは下の schedule を復活させる:
#   schedule:
#     - cron: "0 22 * * *"   # UTC 22:00 = 日本時間 7:00
on:
  workflow_dispatch:        # Actions の画面・スマホから手動で動かす
    inputs:
      url:
        description: "訳したい Reddit のスレの URL（空なら config.json の板から自動で作る）"
        required: false
        default: ""
      count:
        description: "作る本数（空なら config.json の articles_per_run）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MATOME_ARTICLES: ${{ github.workspace }}/data
      MATOME_SITE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code を入れる
        run: npm install -g @anthropic-ai/claude-code

      - name: 記事を作る
        id: make
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          THREAD_URL: ${{ inputs.url }}
          THREAD_COUNT: ${{ inputs.count }}
        run: python tool/matome.py "${THREAD_URL:-$THREAD_COUNT}"

      - name: ページとフィードを作る
        run: python tool/build.py

      - name: 公開する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "update $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push

      # URL を渡したときだけ、できたページを Raindrop.io に保存する（失敗しても記事は公開済みなので止めない）
      - name: Raindrop に保存する
        if: inputs.url != '' && steps.make.outputs.post_id != ''
        continue-on-error: true
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
        run: python tool/matome.py --raindrop "${{ steps.make.outputs.post_id }}"
